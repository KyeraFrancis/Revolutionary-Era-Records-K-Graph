[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcgraph"
version = "0.1.0"
description = "OCR fine-tuning, entity extraction, and a Neo4j knowledge graph over public Revolutionary-era archives (NARA, Smithsonian, Chronicling America)."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kyera Francis"}]
dependencies = [
  "datasets>=2.19",
  "pandas>=2.0",
  "pyarrow>=14",
  "pillow>=10",
  "requests>=2.31",
  "pyyaml>=6",
  "jiwer>=3.0",
  "rapidfuzz>=3.5",
  "typer>=0.12",
  "tqdm>=4.66",
]

[project.optional-dependencies]
ocr = ["torch>=2.2", "transformers>=4.40", "accelerate>=0.30", "evaluate>=0.4"]
nlp = ["spacy>=3.7"]
graph = ["neo4j>=5.20"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.4", "mypy"]
all = ["rcgraph[ocr,nlp,graph,dev]"]

[project.scripts]
rcgraph = "rcgraph.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
